services:
  - type: web
    name: loango-api
    env: node
    runtime: node
    plan: free
    buildCommand: "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://loango-frontend.vercel.app

databases:
  - name: loango-db
    plan: free
    databaseName: loango
    user: loango
