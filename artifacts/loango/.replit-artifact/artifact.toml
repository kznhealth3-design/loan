kind = "web"
previewPath = "/loango/"
title = "LoanGo Web"
version = "1.0.0"
id = "artifacts/loango"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/loango/" ]
localPort = 19728

[services.development]
run = "pnpm --filter @workspace/loango run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loango", "run", "build" ]
publicDir = "artifacts/loango/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19728"
BASE_PATH = "/loango/"
