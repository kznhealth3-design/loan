services:
  - type: web
    name: loango-api
    env: node
    runtime: node
    buildCommand: "pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: loango-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ISSUER_URL
        value: https://replit.com/oidc
      - key: REPL_ID
        sync: false
      - key: REPL_ID
        value: loango-render
      - key: FRONTEND_URL
        value: https://loango-frontend.vercel.app
    healthCheckPath: /api/healthz
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1

databases:
  - name: loango-db
    plan: free
    databaseName: loango
    user: loango
